# The words of the core protocol (docs/core-protocol.md) that every core and
# Ectomatter share: the names of keys, modifiers and media keys, and the
# actions a control can be given. Cores built for WebAssembly use it too, so
# it needs nothing but serde_json.
[package]
name = "ectomatter-protocol"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Ectonomic/Ectomatter"
description = "The shared names and actions of Ectomatter's core protocol."

[dependencies]
serde_json = "1"
