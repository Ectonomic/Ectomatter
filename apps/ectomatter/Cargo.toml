[package]
name = "ectomatter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Ectomatter as a native window: every pixel drawn in Rust, the keyboard in HDR"

[dependencies]
bytemuck = "1"
ectomatter-draw = { path = "../../crates/ectomatter-draw" }
# the core protocol's shared names and actions
ectomatter-protocol = { path = "../../crates/ectomatter-protocol" }
# the winit shell: its window and input, and its frames shown through wgpu (src/shell/winit.rs)
ectomatter-present = { path = "../../crates/ectomatter-present" }
# the winit shell's windows of their own, drawn on the CPU, and the system's clipboard
softbuffer = "0.4.8"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
# the cursors both shells name (the Wayland toolkit's and winit's are this crate's)
cursor-icon = "1.2"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11"] }
# (what a sensor is and how a reading is written: the Sensor Feed plugin finds and reads them)
ectomatter-sensors = { path = "../../crates/ectomatter-sensors" }
# the USB devices cores reach, each through Ectomatter (core_host.rs)
hidapi = "2.6"
# cores run as WebAssembly components (core_host.rs, the interface in wit/core.wit)
# (only what running a package takes: compiling it here, components, WASI
# preview 2. Not wasmtime's compiled-code cache, its text format, its garbage
# collector, threads, profiling or debugging, which Ectomatter doesn't use and
# whose libraries would ship with it: the cache's zstd had RustSec's advisories)
wasmtime = { version = "=50.0.1", default-features = false, features = ["runtime", "std", "cranelift", "component-model", "parallel-compilation"] }
wasmtime-wasi = { version = "=50.0.1", default-features = false, features = ["p2"] }
resvg = "0.49"
harfrust = "0.15"
serde_json.workspace = true
# (what goes over D-Bus, written and read as zbus asks: bus.rs, tray.rs)
serde.workspace = true
# a package's update checked against the checksum its release gives (updates.rs)
sha2 = "0.11"
# the window adapter says which cursor Slint asks for, through its internal hook
i-slint-core = "=1.18.1"
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "std", "renderer-software", "software-renderer-systemfonts"] }
sys-locale = "0.3.2"
# KDE's own account of each screen (kde-output-device-v2, vendored in protocols/)
bitflags = "2"
libc = "0.2"
# game names folded to plain letters for the screen, as the z10-lcd service did (NFKD)
unicode-normalization = "0.1"
# the Library's Steam games (steam.rs): where Steam is on Linux, Windows and macOS, its
# libraries and installed apps; and its binary appinfo.vdf, which says which app is a game
steamlocate = "2.1.1"
steam-vdf-parser = "0.1.2"
# plugins added from a file or their GitHub releases (packages.rs, updates.rs): a
# package is a zip of its folder, fetched over HTTPS as the weather is
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

# what's Linux's alone: the Wayland shell's window, KDE's outputs and shadows,
# D-Bus (the tray, the file picker, the app in front, the screens' brightness)
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6.2", default-features = false, features = ["default-rt", "proxy", "service"] }
# (a stream's next item, for the signals zbus hands as streams: bus.rs)
futures-core = "0.3"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-scanner = "0.31"
wayland-backend = "0.3"

[dev-dependencies]
# the Z10's driver, for tests that check what its core sends against what the
# original editor sent; the app itself reaches the keyboard only through its core
evga-z10 = { version = "0.1.0", path = "../../cores/evga-z10/crates/evga-z10" }
# (tests read made-up computers themselves, as the Sensor Feed plugin reads this one)
ectomatter-sensors = { path = "../../crates/ectomatter-sensors", features = ["read", "fake"] }
# the parity vectors the Z10 module is checked against are gzipped
flate2 = "1"
# the boundary checks read the app's source as Rust, its tests set apart by line (boundaries.rs)
syn = { version = "3", features = ["full", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
# the render tests read and write their pictures (tests/renders.rs)
png = "0.18"
# (a test reads the glyph typefaces for the characters they have, as ectomatter-draw does)
skrifa = "0.49"
# the boundary checks read the workspace's Cargo.toml files as TOML (boundaries.rs)
toml = "1"

[build-dependencies]
slint-build = "1.18.1"
# the design tokens, written out as Slint and Rust (build.rs)
ectomatter-tokens = { path = "../../crates/ectomatter-tokens" }
