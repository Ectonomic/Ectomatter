# The misbehaving plugin's module (../core.json), built for wasm32-wasip2 by
# tools/build-test-packages.sh. Its own workspace, since it builds only for
# WebAssembly.
[package]
name = "misbehaving-plugin"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ectomatter-protocol = { path = "../../../../../../crates/ectomatter-protocol" }
serde_json = "1"
wit-bindgen = "=0.62.0"

[workspace]

[profile.release]
lto = true
strip = true
