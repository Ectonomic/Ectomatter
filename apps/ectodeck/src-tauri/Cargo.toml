[package]
name = "ectodeck"
version = "0.1.0"
description = "One app for every device on your desk."
authors = ["Grant Garrison"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.90"

[lib]
name = "ectodeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
ectotype-core = { path = "../../../crates/ectotype-core" }
ectodeck-weather = { path = "../../../crates/ectodeck-weather" }
sys-locale = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri = { version = "2.12.0", features = ["tray-icon"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
