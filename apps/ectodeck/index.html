<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ectodeck</title>
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/window.css">
<style>
  /* The main window shows Keys, Lighting and Settings; the Macro Editor is its own window. */
  .win-main #view-macros { display: none !important; }
  .win-macros #pws, .win-macros .navtabs, .win-macros .crumb:not(.mtitle), .win-macros .sep,
  .win-macros .conn, .win-macros #open-macros { display: none !important; }
  .win-main .mtitle { display: none; }
  /* The keyboard fills the panel's width, as it did in a tall browser window.
     Sized to a desktop window's height instead, it came out a third smaller,
     too small for its display and its keycaps' grain to read cleanly. The
     page scrolls when the window is short. */
  .win-main .pws-body .board { width: 100%; }
  .win-macros .page { padding: 0; max-width: none; }
  .win-macros .mws { margin: 0; border: 0; border-radius: 0; }
  .win-macros .mws .sec-head { display: none; }
  .win-macros .mws .ws { min-height: calc(100vh - 37px); }
</style>
</head>
<body>
<!-- Ectodeck's own title bar, as the MagTran app draws it: the mark and the
     wordmark, the device, then the tabs, the keyboard's status, the Macro
     Editor, and the window's own controls. Dragging it moves the window. -->
<header class="nav tbar" data-tauri-drag-region aria-label="Sections">
  <span class="home"><img src="/mark.svg" alt="" width="16" height="16" draggable="false"><span class="wm">Ectodeck</span></span>
  <span class="sep" aria-hidden="true">/</span>
  <span class="crumb">EVGA Z10 RGB</span>
  <span class="crumb mtitle">Macro Editor</span>
  <div class="navtabs" role="tablist">
    <button role="tab" id="tab-keys" aria-selected="true" data-view="keys">Keys</button>
    <button role="tab" id="tab-lighting" aria-selected="false" data-view="lighting">Lighting</button>
    <button role="tab" id="tab-display" aria-selected="false" data-view="display">Settings</button>
  </div>
  <span id="status" class="status" role="status" aria-live="polite"></span>
  <span class="conn wait" id="conn"><i></i><span id="devline">Looking for the keyboard…</span></span>
  <button class="tact" id="open-macros" type="button"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="1.5" y="4" width="13" height="8.5" rx="1.6"/><path d="M4 7h1M7 7h1M10 7h2M4.5 9.8h7"/></svg>Macro Editor</button>
  <span class="wbtns">
    <button type="button" id="w-min" aria-label="Minimise"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button type="button" id="w-max" aria-label="Maximise"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="1" stroke="currentColor" stroke-width="1.4" fill="none"/></svg></button>
    <button type="button" id="w-close" class="x" aria-label="Close"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="1.4"/></svg></button>
  </span>
</header>

<main class="page">
  <!-- Lighting, Keys and Settings each edit one profile: they share this window,
       with the profile picker and that profile's Discard and Save in its head. -->
  <section class="pws" id="pws">
    <div class="pws-head">
      <!-- where the profile tabs will be, while the keyboard is read -->
      <div class="boot" id="boot" role="status" aria-live="polite">
        <span class="spin" aria-hidden="true"></span>
        <div><b>Reading your keyboard</b><span>Loading its profiles and macros. This takes a few seconds.</span></div>
      </div>
      <nav class="profiles" id="profiles" aria-label="Profiles"></nav>
      <span id="live" class="live" hidden><i></i>Showing on keyboard</span>
      <button id="revert" class="ghost" disabled>Discard</button>
      <button id="save" class="primary" disabled>Save profile 1</button>
    </div>
    <div class="pws-body">
      <div class="board" id="board"></div>
      <p class="hint" id="boardhint"></p>
      <section class="panel" id="view-lighting" role="tabpanel" aria-labelledby="tab-lighting"></section>
      <section class="panel" id="view-keys" role="tabpanel" aria-labelledby="tab-keys" hidden></section>
      <section class="panel" id="view-display" role="tabpanel" aria-labelledby="tab-display" hidden></section>
    </div>
  </section>
  <!-- On the Keys page, its own window under the profile's. Macros are not part
       of a profile: every profile shares them and each one saves on its own. -->
  <section class="mws" id="view-macros" aria-labelledby="macros-title" hidden></section>
</main>

<script src="/bridge.js"></script>
<script src="/window.js"></script>
<script src="/app.js"></script>
</body>
</html>
