[package]
name = "ectodeck-native"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Ectodeck as a native window: every pixel drawn in Rust, the keyboard in HDR"

[dependencies]
bytemuck = "1"
ectodeck-draw = { path = "../../crates/ectodeck-draw" }
ectotype-core = { version = "0.1.0", path = "../../crates/ectotype-core" }
resvg = "0.45"
serde_json = "1.0.151"
slint = { version = "1.18.1", default-features = false, features = ["compat-1-2", "std", "renderer-software", "software-renderer-systemfonts"] }
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[build-dependencies]
slint-build = "1.18.1"
