[package]
name = "ectodeck-native"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Ectodeck as a native window: every pixel drawn in Rust, the keyboard in HDR"

[dependencies]
bytemuck = "1"
ectodeck-draw = { path = "../../crates/ectodeck-draw" }
ectodeck-weather = { version = "0.1.0", path = "../../crates/ectodeck-weather" }
ectotype-core = { version = "0.1.0", path = "../../crates/ectotype-core" }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
# the desktop portal's file picker (picker.rs), the same zbus the tray uses
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
resvg = "0.45"
rustybuzz = "0.20.1"
serde_json = "1.0.151"
# the window adapter says which cursor Slint asks for, through its internal hook
i-slint-core = "=1.18.1"
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "std", "renderer-software", "software-renderer-systemfonts"] }
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"] }
sys-locale = "0.3.2"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# KDE's own account of each screen (kde-output-device-v2, vendored in protocols/)
wayland-scanner = "0.31"
wayland-backend = "0.3"
bitflags = "2"

[build-dependencies]
slint-build = "1.18.1"
