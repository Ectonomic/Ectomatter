[workspace]
resolver = "3"
members = ["crates/ectomatter-tokens", "crates/ectomatter-sensors", "crates/ectomatter-draw", "crates/ectomatter-protocol", "crates/ectomatter-present", "apps/ectomatter", "apps/ectomatter-launch"]
# (each core and plugin is a repository of its own, linked here as a
# submodule, with its own workspace)
exclude = ["cores", "plugins"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
authors = ["Grant Garrison", "Claude"]
repository = "https://github.com/Ectonomic/Ectomatter"

# One serde_json for every crate: features unify across a build, so a crate
# asking for its own would change how the app reads JSON depending on what
# else is built with it. Objects keep the order they were written in.
[workspace.dependencies]
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }

# The HDR keyboard is drawn on the CPU each time its light changes, and the
# pieces it is drawn from are rendered with resvg; unoptimized, both are too
# slow to follow a lighting effect, so they are built optimized in development
# too.
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.ectomatter]
opt-level = 3
[profile.dev.package.ectomatter-draw]
opt-level = 3
[profile.dev.package.i-slint-core]
opt-level = 3
[profile.dev.package.i-slint-renderer-software]
opt-level = 3
