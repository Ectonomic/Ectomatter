[workspace]
resolver = "3"
members = ["crates/evga-z10", "crates/ectomatter-tokens", "crates/ectomatter-weather", "crates/ectomatter-sensors", "crates/ectomatter-draw", "crates/ectomatter-protocol", "apps/ectomatter", "apps/ectomatter-launch"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/OMGrant/Ectomatter"

# The HDR keyboard is drawn on the CPU each time its light changes, and the
# pieces it is drawn from are rendered with resvg; unoptimized, both are too
# slow to follow a lighting effect, so they are built optimized in development
# too.
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.ectomatter]
opt-level = 3
[profile.dev.package.ectomatter-draw]
opt-level = 3
[profile.dev.package.i-slint-core]
opt-level = 3
[profile.dev.package.i-slint-renderer-software]
opt-level = 3
